# keyball39 の VIA対応ファームウェアをビルドする workflow
#
# 実行方法:
#   - 自動: keyball39 関連のコード (keyball39/, lib/, drivers/) を push したとき、
#           またはそれを変える PR を出したとき (PR に push したときも)
#   - 手動: Actions タブ → "Build Keyball39 VIA firmware" → "Run workflow"
#     (手動実行はこのファイルがデフォルトブランチにある場合のみ表示されます)
#
# ビルド結果: workflow 実行ページ下部の Artifacts から
#             keyball39-via-firmware (zip) をダウンロードして .hex を書き込む
#
# ビルド結果は、次のタグのプレリリースにも置く (.github/scripts/firmware-release.sh)。
# 認証なしで取得でき、Artifacts と違って期限切れにならない:
#   firmware-latest         custom ブランチの最新ビルド (push のたびに置き換える)
#   firmware-custom-<sha7>  custom ブランチのビルドの履歴 (新しいものから 30 件を残す)
#   firmware-pr-<番号>      PR のビルド (PR に push するたびに置き換える。新しいものから 30 件を残す)
#   https://github.com/<owner>/<repo>/releases/download/<タグ>/keyball_keyball39_via.hex
#   https://github.com/<owner>/<repo>/releases/download/<タグ>/BUILD_INFO.txt
# zmk-config-keyboards の tools/flash.cmd (flash-keyball.cmd) は、ここから選んだビルドを書き込む。

name: Build Keyball39 VIA firmware

run-name: Build keyball39:via (${{ github.ref_name }})

on:
  workflow_dispatch: {}

  push:
    paths:
      - 'qmk_firmware/keyboards/keyball/keyball39/**'
      - 'qmk_firmware/keyboards/keyball/lib/**'
      - 'qmk_firmware/keyboards/keyball/drivers/**'
      - '.github/**.yml'
      - '.github/scripts/**'
    tags-ignore:
      - '**'
    branches:
      - '**'

  # PR のビルドは firmware-pr-<番号> に置く (publish-pr ジョブ)
  pull_request:
    paths:
      - 'qmk_firmware/keyboards/keyball/keyball39/**'
      - 'qmk_firmware/keyboards/keyball/lib/**'
      - 'qmk_firmware/keyboards/keyball/drivers/**'
      - '.github/**.yml'
      - '.github/scripts/**'

jobs:

  build:

    uses: ./.github/workflows/build-firmware.yml
    with:
      qmk_version: '0.34.6'
      keyboard:    keyball39
      keymap:      via

  check-size:
    name: Check size
    runs-on: ubuntu-22.04
    needs:
    - build

    steps:

    - uses: actions/download-artifact@v6
      with:
        pattern: "*-firmware"
        merge-multiple: true

    - name: List size of firmwares
      run: |
        for f in *.hex ; do
          cut -c 2,3 $f | awk '{s+=strtonum("0x" $1)}END{printf "%5d/28672 (%2d%%, %5d bytes free) ",s,s*100/28672,28672-s}'
          echo $f
        done

  publish-latest:
    name: Publish firmware-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-22.04
    needs:
    - build
    permissions:
      contents: write
    concurrency:
      group: firmware-latest
      cancel-in-progress: false

    steps:

    - uses: actions/checkout@v6
      with:
        sparse-checkout: .github/scripts
        persist-credentials: false

    - uses: actions/download-artifact@v6
      with:
        name: keyball39-via-firmware
        path: firmware

    - name: Publish firmware-latest
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        HEAD_SHA: ${{ github.sha }}
        DESCRIPTION: keyball39:via
      run: bash .github/scripts/firmware-release.sh latest firmware/keyball_keyball39_via.hex

  # 待機中のジョブは、同じグループの新しいジョブに取り消されるので、コミットごとにグループを分ける
  # (続けて push しても、それぞれのビルドが履歴に残る)
  publish-custom:
    name: Publish firmware-custom
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    runs-on: ubuntu-22.04
    needs:
    - build
    permissions:
      contents: write
    concurrency:
      group: firmware-custom-${{ github.sha }}
      cancel-in-progress: false

    steps:

    - uses: actions/checkout@v6
      with:
        sparse-checkout: .github/scripts
        persist-credentials: false

    - uses: actions/download-artifact@v6
      with:
        name: keyball39-via-firmware
        path: firmware

    - name: Publish firmware-custom-<sha7>
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        HEAD_SHA: ${{ github.sha }}
        KEEP: '30'
        DESCRIPTION: keyball39:via
      run: bash .github/scripts/firmware-release.sh custom firmware/keyball_keyball39_via.hex

  # 同じリポジトリのブランチからの PR だけ (fork と Dependabot の PR は書き込み権限が無い)
  publish-pr:
    name: Publish firmware-pr
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    needs:
    - build
    permissions:
      contents: write
    concurrency:
      group: firmware-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:

    - uses: actions/checkout@v6
      with:
        sparse-checkout: .github/scripts
        persist-credentials: false

    - uses: actions/download-artifact@v6
      with:
        name: keyball39-via-firmware
        path: firmware

    - name: Publish firmware-pr-<number>
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        KEEP: '30'
        DESCRIPTION: keyball39:via
      run: bash .github/scripts/firmware-release.sh pr firmware/keyball_keyball39_via.hex
