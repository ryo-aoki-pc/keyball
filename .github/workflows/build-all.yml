name: Build all firmwares

on:
  workflow_dispatch: {}

  workflow_call: {}

jobs:

  build:

    strategy:
      matrix:
        # QMK 0.34.6 に移植したのは keyball39 だけ。keyball44 / keyball61 / keyball46 / one47 は
        # QMK 0.22.14 の API のままなのでビルドできない (移植するまで対象から外す)
        keyboard: [ keyball39 ]
        keymap: [ test, default, via ]

    uses: ./.github/workflows/build-firmware.yml
    with:
      qmk_version: '0.34.6'
      keyboard:    ${{ matrix.keyboard }}
      keymap:      ${{ matrix.keymap }}

  check-size:
    name: Check size
    runs-on: ubuntu-22.04
    needs:
    - build

    steps:

    - uses: actions/download-artifact@v6
      with:
        pattern: "*-firmware"
        merge-multiple: true

    - name: List size of firmwares
      run: |
        for f in *.hex ; do
          cut -c 2,3 $f | awk '{s+=strtonum("0x" $1)}END{printf "%5d/28672 (%2d%%, %5d bytes free) ",s,s*100/28672,28672-s}'
          echo $f
        done
