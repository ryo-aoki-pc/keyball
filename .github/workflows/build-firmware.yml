name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.34.6'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      # QMK 0.34.6 の公式のツールチェイン (avr-gcc 15.2) の入った qmk_cli。digest で固定する
      image: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a

    steps:

    - name: Checkout source
      uses: actions/checkout@v6

    - name: Checkout qmk_firmware
      uses: ./.github/actions/checkout-qmk_firmware
      with:
        version: ${{ inputs.qmk_version }}

    - name: Install a link to own source
      run: ln -s $(pwd)/qmk_firmware/keyboards/keyball __qmk__/keyboards/keyball

    - name: Install missing python modules
      # このイメージの python3 は qmk CLI の venv のもの (/usr/bin/python3 は PEP 668 で pip を使えない)
      run: python3 -m pip install -r __qmk__/requirements.txt

    - name: Compile and link
      run: qmk compile -j 4 -kb keyball/${{ inputs.keyboard }} -km ${{ inputs.keymap }}

    - name: Archive built firmware
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: __qmk__/*.hex
